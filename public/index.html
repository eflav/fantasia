<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="format-detection" content="telephone=no"/>
  <title>fantasia</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: #000;
      color: #0f0;
      font-family: "IBM Plex Mono", "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    #wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      padding: 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(12px + env(safe-area-inset-left, 0px));
      padding-right: calc(12px + env(safe-area-inset-right, 0px));
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
    }
    #out {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #0a0;
      padding: 10px;
      margin-bottom: 10px;
      line-height: 1.4;
      font-size: 14px;
    }
    #row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      flex-shrink: 0;
    }
    #prompt {
      display: flex;
      align-items: center;
      color: #0f0;
      white-space: nowrap;
      font-size: 14px;
      padding-right: 2px;
    }
    #in {
      flex: 1;
      min-width: 0;
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 10px 12px;
      font: inherit;
      font-size: 16px; /* iOS: avoid auto-zoom */
      outline: none;
      border-radius: 0;
      -webkit-appearance: none;
      appearance: none;
      min-height: 44px;
    }
    #in:focus { border-color: #6f6; }
    #send {
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      font: inherit;
      font-size: 16px;
      padding: 0 16px;
      min-width: 64px;
      min-height: 44px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #send:active, #send:hover { background: #0f0; color: #000; }
    #send:disabled { opacity: 0.4; }
    .dim { color: #3a3; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="out" class="dim">loading…</div>
    <div id="row">
      <span id="prompt">$</span>
      <input id="in"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="send"
        inputmode="text"
        placeholder="story or command…"
        aria-label="fantasia input"/>
      <button type="button" id="send" aria-label="send">ret</button>
    </div>
  </div>
  <script>
    const out = document.getElementById('out');
    const input = document.getElementById('in');
    const sendBtn = document.getElementById('send');
    const wrap = document.getElementById('wrap');

    function tokenHeaders() {
      const h = { 'Content-Type': 'application/json' };
      const q = new URLSearchParams(location.search).get('token');
      const stored = sessionStorage.getItem('fantasia_token');
      const t = q || stored;
      if (q) sessionStorage.setItem('fantasia_token', q);
      if (t) h['Authorization'] = 'Bearer ' + t;
      return h;
    }

    function execUrl() {
      const q = new URLSearchParams(location.search).get('token');
      const stored = sessionStorage.getItem('fantasia_token');
      const t = q || stored;
      return t ? '/api/exec?token=' + encodeURIComponent(t) : '/api/exec';
    }

    function append(text) {
      out.textContent += (out.textContent ? '\n' : '') + text;
      out.scrollTop = out.scrollHeight;
    }

    function fitViewport() {
      if (!window.visualViewport) return;
      const vv = window.visualViewport;
      const h = vv.height;
      wrap.style.height = h + 'px';
      wrap.style.maxHeight = h + 'px';
      // Keep input row visible above keyboard
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
      out.scrollTop = out.scrollHeight;
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitViewport);
      window.visualViewport.addEventListener('scroll', fitViewport);
      fitViewport();
    }

    async function boot() {
      try {
        const r = await fetch('/api/banner');
        const j = await r.json();
        out.textContent = j.banner + '\nbackend: ' + j.backend + '\n';
        if (j.tokenRequired) {
          out.textContent += '(auth: append ?token=… to the URL)\n';
        }
      } catch (e) {
        out.textContent = 'fantasia web terminal\n(backend unreachable)\n';
      }
    }

    async function exec(line) {
      append('$ fantasia> ' + line);
      input.disabled = true;
      sendBtn.disabled = true;
      try {
        const r = await fetch(execUrl(), {
          method: 'POST',
          headers: tokenHeaders(),
          body: JSON.stringify({ line }),
        });
        const j = await r.json();
        if (r.status === 401) {
          append('error: unauthorized — set ?token= or FANTASIA_TOKEN');
        } else {
          for (const l of (j.lines || [])) append(l);
          if (j.error) append('error: ' + j.error);
        }
      } catch (e) {
        append('error: ' + e.message);
      }
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      fitViewport();
    }

    function submit() {
      const v = input.value;
      input.value = '';
      if (v.trim()) exec(v);
    }

    sendBtn.addEventListener('click', (e) => {
      e.preventDefault();
      submit();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submit();
      }
    });

    boot();
  </script>
</body>
</html>
